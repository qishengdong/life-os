# Life OS V0 — Docker Compose for VPS deployment
#
# 用法:
#   1. 复制 .env.example 到 .env, 填入 DEEPSEEK_API_KEY
#   2. docker compose up -d
#   3. 配置 nginx/Caddy 反向代理 (HTTPS) 到 localhost:3000

version: '3.9'

services:
  life-os:
    build: .
    image: life-os:latest
    container_name: life-os
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # 仅本地端口, 通过 nginx 暴露
    environment:
      - NODE_ENV=production
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LIFEOS_USE_4FILE_PROMPT=${LIFEOS_USE_4FILE_PROMPT:-true}
      - LIFEOS_INSPECTOR_MODE=${LIFEOS_INSPECTOR_MODE:-shadow}
      - DATABASE_PATH=/app/data/life-os.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: nginx for HTTPS termination + 备案合规 header
